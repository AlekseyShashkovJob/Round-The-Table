name: round_the_table
description: Tip calculator and bill splitter
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.5.0
  appsflyer_sdk: ^6.17.5
  shared_preferences: ^2.2.2
  webview_flutter_wkwebview: ^3.23.1
  url_launcher: ^6.3.2
  external_app_launcher: ^4.0.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
